<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Token pipeline: production path and this project's free-plan path</title>
<desc>Production syncs Figma to DTCG JSON through a plugin or API. This project, on the Figma free plan, builds the JSON from a source file by hand and mirrors Figma manually. Both continue through Style Dictionary, platform outputs, CI tests and release.</desc>
<style>:root{--bg:#f5f7f4;--bx:#ffffff;--bs:#a8aea5;--tx:#1b1e1c;--t2:#565d56;--ln:#7d857b;--lm:#d2ee46;--lt:#1b1e1c;--ac:#5c6c0b}@media (prefers-color-scheme: dark){:root{--bg:#1b1e1c;--bx:#2a2e2a;--bs:#565d56;--tx:#f5f7f4;--t2:#a8aea5;--ln:#7d857b;--ac:#d2ee46}}.bg{fill:var(--bg)}.th{font-size:14px;font-weight:600;fill:var(--tx)}.ts{font-size:12px;fill:var(--t2)}.lab{font-size:12px;font-weight:600;fill:var(--t2);letter-spacing:.04em}.b rect{fill:var(--bx);stroke:var(--bs);stroke-width:1}.me rect{stroke:var(--ac);stroke-width:1.5}.dj rect{fill:var(--lm);stroke:var(--lm)}.dj .th,.dj .ts{fill:var(--lt)}.nx rect{stroke-dasharray:4 3}.arr{stroke:var(--ln);stroke-width:1.5;fill:none}.dsh{stroke-dasharray:4 3}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="760" height="520"/>
<text class="lab" x="30" y="44">PRODUCTION</text>
<g class="b "><rect x="30" y="56" width="140" height="56" rx="8"/><text class="th" x="100.0" y="76.0" text-anchor="middle" dominant-baseline="central">Figma</text><text class="ts" x="100.0" y="94.0" text-anchor="middle" dominant-baseline="central">Designers edit</text></g>
<path d="M170 84 L208 84" class="arr" marker-end="url(#a)"/>
<g class="b "><rect x="210" y="56" width="140" height="56" rx="8"/><text class="th" x="280.0" y="76.0" text-anchor="middle" dominant-baseline="central">Sync</text><text class="ts" x="280.0" y="94.0" text-anchor="middle" dominant-baseline="central">Plugin or API</text></g>
<text class="lab" x="30" y="146">THIS PROJECT (FIGMA FREE PLAN)</text>
<g class="b me"><rect x="30" y="158" width="140" height="56" rx="8"/><text class="th" x="100.0" y="178.0" text-anchor="middle" dominant-baseline="central">Source file</text><text class="ts" x="100.0" y="196.0" text-anchor="middle" dominant-baseline="central">token-source.js</text></g>
<path d="M170 186 L208 186" class="arr" marker-end="url(#a)"/>
<g class="b me"><rect x="210" y="158" width="140" height="56" rx="8"/><text class="th" x="280.0" y="178.0" text-anchor="middle" dominant-baseline="central">Build</text><text class="ts" x="280.0" y="196.0" text-anchor="middle" dominant-baseline="central">npm run build</text></g>
<path d="M350 84 L400 84 L400 120 L518 120" class="arr" marker-end="url(#a)"/>
<path d="M350 186 L400 186 L400 150 L518 150" class="arr" marker-end="url(#a)"/>
<g class="b dj"><rect x="520" y="92" width="210" height="88" rx="8"/><text class="th" x="625.0" y="128.0" text-anchor="middle" dominant-baseline="central">DTCG JSON</text><text class="ts" x="625.0" y="146.0" text-anchor="middle" dominant-baseline="central">tokens/*.json</text></g>
<path d="M100 214 L100 252" class="arr dsh" marker-end="url(#a)"/>
<g class="b me"><rect x="30" y="254" width="160" height="70" rx="8"/><text class="th" x="110.0" y="281.0" text-anchor="middle" dominant-baseline="central">Figma</text><text class="ts" x="110.0" y="299.0" text-anchor="middle" dominant-baseline="central">Mirrored by hand</text></g>
<text class="ts" x="110" y="338" text-anchor="middle">npm run compare checks drift</text>
<path d="M280 214 L280 252" class="arr" marker-end="url(#a)"/>
<g class="b me"><rect x="210" y="254" width="200" height="70" rx="8"/><text class="th" x="310.0" y="281.0" text-anchor="middle" dominant-baseline="central">Tests</text><text class="ts" x="310.0" y="299.0" text-anchor="middle" dominant-baseline="central">Aliases, names, WCAG AA</text></g>
<text class="ts" x="310" y="338" text-anchor="middle">fails the build on a miss</text>

<path d="M625 180 L625 238" class="arr" marker-end="url(#a)"/>
<g class="b nx"><rect x="520" y="240" width="210" height="52" rx="8"/><text class="th" x="625.0" y="258.0" text-anchor="middle" dominant-baseline="central">Style Dictionary</text><text class="ts" x="625.0" y="276.0" text-anchor="middle" dominant-baseline="central">Transforms the tokens</text></g>
<g class="b nx"><rect x="520" y="306" width="210" height="52" rx="8"/><text class="th" x="625.0" y="324.0" text-anchor="middle" dominant-baseline="central">Platform outputs</text><text class="ts" x="625.0" y="342.0" text-anchor="middle" dominant-baseline="central">CSS, Swift, Kotlin</text></g>
<g class="b nx"><rect x="520" y="372" width="210" height="52" rx="8"/><text class="th" x="625.0" y="390.0" text-anchor="middle" dominant-baseline="central">CI tests</text><text class="ts" x="625.0" y="408.0" text-anchor="middle" dominant-baseline="central">Run on every PR</text></g>
<g class="b nx"><rect x="520" y="438" width="210" height="52" rx="8"/><text class="th" x="625.0" y="456.0" text-anchor="middle" dominant-baseline="central">Release</text><text class="ts" x="625.0" y="474.0" text-anchor="middle" dominant-baseline="central">Review, version tag</text></g>
<path d="M625 292 L625 304" class="arr" marker-end="url(#a)"/>
<path d="M625 358 L625 370" class="arr" marker-end="url(#a)"/>
<path d="M625 424 L625 436" class="arr" marker-end="url(#a)"/>
<text class="lab" x="520" y="512">PRODUCTION STEPS, NEXT HERE</text>
</svg>